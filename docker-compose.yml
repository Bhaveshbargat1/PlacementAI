version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: placementai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/placementai
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-in-production}
      MODEL_DIR: /app/models
      DATASET_PATH: /app/dataset/students.csv
      METRICS_PATH: /app/models/metrics.json
      TRAIN_SCRIPT_PATH: /app/training/train_model.py
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./dataset:/app/dataset
      - ./training:/app/training
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  pgdata:
